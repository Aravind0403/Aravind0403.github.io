<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">{% elsif site.description %}<meta name="description" content="{{ site.description }}">{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1e1e2e;
  --surface: #313244;
  --rule: #45475a;
  --text: #cdd6f4;
  --muted: #a6adc8;
  --accent: #94e2d5;
  --accent-warm: #f9e2af;
  --accent-violet: #cba6f7;
  --code-bg: #313244;
  --shell-max: 1320px;
}
* { box-sizing: border-box; }
html { background: var(--bg); scroll-behavior: smooth; scrollbar-gutter: stable; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 17px; line-height: 1.7;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
.site-nav { border-bottom: 1px solid var(--rule); }
.site-nav-inner {
  max-width: var(--shell-max); margin: 0 auto; padding: 1rem 2rem;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  font-size: 0.875rem;
}
.site-nav .brand { color: var(--text); font-weight: 600; text-decoration: none; border-bottom: none; letter-spacing: -0.01em; }
.site-nav .brand:hover { color: var(--accent); }
.site-nav .nav-links { display: flex; gap: 1rem; align-items: center; }
.site-nav .nav-links a { color: var(--muted); text-decoration: none; border-bottom: none; display: inline-flex; align-items: center; }
.site-nav .nav-links a:hover { color: var(--accent); }
.nav-icon { width: 19px; height: 19px; fill: currentColor; display: block; }
.page { max-width: var(--shell-max); margin: 0 auto; padding: 0 2rem; }
@media (max-width: 700px) {
  .site-nav-inner { padding: 0.85rem 1.25rem; }
  .page { padding: 0 1.25rem; }
}
h1 { font-size: 2.5rem; line-height: 1.15; margin: 0 0 0.5rem; font-weight: 700; letter-spacing: -0.025em; }
h2 { font-size: 1.875rem; line-height: 1.2; margin: 4rem 0 1.25rem; font-weight: 700; letter-spacing: -0.015em; color: var(--text); scroll-margin-top: 2rem; }
h2:first-child { margin-top: 0; }
h3 { font-size: 1.25rem; margin: 2.75rem 0 1rem; font-weight: 600; color: var(--accent); scroll-margin-top: 2rem; }
h4 { font-size: 1.0625rem; margin: 2rem 0 0.75rem; font-weight: 600; color: var(--accent-warm); }
p { margin: 0 0 1.25rem; }
p strong, li strong { color: var(--text); font-weight: 600; }
em { color: var(--muted); font-style: italic; }
ul, ol { margin: 0 0 1.25rem; padding-left: 1.25rem; }
li { margin: 0 0 0.625rem; }
a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(148,226,213,0.3); transition: border-color 0.15s; }
a:hover { border-bottom-color: var(--accent); }
hr { border: none; border-top: 1px solid var(--rule); margin: 3rem 0; }
code {
  font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.875em;
  background: var(--code-bg); padding: 0.125rem 0.4rem; border-radius: 4px;
  color: var(--accent); border: 1px solid var(--rule);
}
pre { background: #181825; border: 1px solid var(--rule); border-radius: 8px; padding: 1.25rem; overflow-x: auto; margin: 0 0 1.5rem; }
pre code { background: none; border: none; padding: 0; font-size: 0.875rem; color: #a6adc8; }
blockquote { margin: 1.5rem 0; padding: 0.75rem 1rem 0.75rem 1.25rem; border-left: 3px solid var(--accent-violet); background: rgba(203,166,247,0.05); border-radius: 0 6px 6px 0; }
blockquote p { margin: 0; color: var(--muted); font-style: italic; }
table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; font-size: 0.9375rem; }
th, td { text-align: left; padding: 0.6rem 0.875rem; border-bottom: 1px solid var(--rule); }
thead th { background: var(--surface); font-weight: 600; font-size: 0.8125rem; letter-spacing: 0.02em; color: var(--text); }
tbody tr:hover td { background: rgba(255,255,255,0.02); }
.subtitle { color: var(--muted); font-size: 1.0625rem; margin: 0 0 1rem; }
.meta { color: var(--muted); font-size: 0.875rem; margin: 0; letter-spacing: 0.02em; }
.lede { font-size: 1.1875rem; line-height: 1.6; }
footer.page-footer {
  margin-top: 0; padding: 2rem 0 4rem; border-top: 1px solid var(--rule);
  color: var(--muted); font-size: 0.875rem; text-align: center;
}
footer.page-footer a { color: var(--accent); }
footer.page-footer p { max-width: 640px; margin: 0 auto 1rem; }
</style>
</head>
<body>

    <div class="nav-links">

</nav>

{{ content }}

</body>
</html>
