---
layout: default
---
<style>
.about-header { border-bottom: 1px solid var(--rule); padding: 4rem 0 2.25rem; margin-bottom: 3rem; max-width: 760px; margin-left: auto; margin-right: auto; }
.about-body { max-width: 760px; margin: 0 auto; padding-bottom: 4rem; }
.about-body h2 { font-size: 1.875rem; }
</style>

<div class="page">
  <header class="about-header">
    <h1>{{ page.title }}</h1>
  </header>
  <div class="about-body">
    {{ content }}
    <footer class="page-footer" style="text-align:left;padding-left:0;border-top:1px solid var(--rule);margin-top:3rem;">
      <p><a href="{{ '/' | relative_url }}">← All posts</a></p>
    </footer>
  </div>
</div>
